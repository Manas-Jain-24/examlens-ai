name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install local OCR tools for integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - run: python -m unittest discover -v
      - run: node --check frontend/app.js
      - run: node --check frontend/workspace.js
      - run: node --test tests/frontend.test.cjs
